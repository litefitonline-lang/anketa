<style>
:root{--bg:#05090B;--card:#0C1618;--card2:#102022;--line:#1E3A3C;--line2:#2A4B4D;--acc:#3ED6CE;--on-acc:#04211F;--text:#F2F7F7;--soft:#C9D6D7;--muted:#8FA5A7;--org:#FF9A52;--org-bg:#3A2210;--g:#5BD68A;--y:#F5C451;--r:#FF8B7B}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
#app{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.scr{display:flex;flex-direction:column;flex:1;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:32px}
.logo{width:34px;height:28px;background:center/contain no-repeat;flex:none}
.brand{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .5s ease}
.cnt{font-size:13px;color:var(--muted);white-space:nowrap}

/* картинка сцены */
.art{position:relative;aspect-ratio:3/4;max-height:52vh;width:100%;border-radius:22px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#123335 0%,#0A1719 55%,#070E10 100%);border:1px solid var(--line);margin:0 auto 16px;flex:none}
.art.short{max-height:34vh;max-height:36svh}
.art.scene{max-height:46vh;max-height:48svh}
.art .back{position:absolute;inset:-12%;background:center/cover no-repeat;filter:blur(18px) brightness(.55) saturate(1.1);transform:scale(1.05)}
.snd{width:34px;height:34px;flex:none;border:0;border-radius:50%;background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.snd svg{width:18px;height:18px}
.snd.on{color:var(--acc)}
.art .ph{position:absolute;inset:0;display:grid;place-items:center}
.art .ph svg{width:38%;max-width:150px;height:auto;stroke:var(--acc);opacity:.85;filter:drop-shadow(0 0 18px rgba(62,214,206,.35))}
.art img,.art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.art.ok img,.art.ok video{opacity:1}
.art.ok .ph{display:none}
/* 1.2: слои – фон и герой, эффекты, наклон */
.art .stage{position:absolute;left:0;top:0;width:100%;height:100%}
.art .lay{position:absolute;inset:0;will-change:transform}
.art .lay img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1}
.art .lay.fig img{animation:heroIn .8s ease both}
.art .lay.fig .breath{animation:heroIn .8s ease both,breath 4.6s ease-in-out .8s infinite;transform-origin:50% 100%}
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.005,1.012)}}
.fx{position:absolute;pointer-events:none;transform:translate(-50%,-50%)}
.fx.glow{width:var(--r,30%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(62,214,206,.42),rgba(62,214,206,0) 68%);animation:pulse 3.2s ease-in-out infinite;mix-blend-mode:screen}
.fx.glow.warm{background:radial-gradient(circle,rgba(255,154,82,.45),rgba(255,154,82,0) 68%)}
@keyframes pulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.fx.ring{width:var(--r,14%);aspect-ratio:1}
.fx.ring::before,.fx.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(62,214,206,.9);animation:ring 1.4s ease-out infinite}
.fx.ring::after{animation-delay:.7s}
@keyframes ring{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(1.5)}}
.fx.steam{width:var(--r,10%);height:calc(var(--r,10%)*2)}
.fx.steam i{position:absolute;bottom:0;width:22%;height:70%;border-radius:50%;background:rgba(242,247,247,.5);filter:blur(5px);animation:steam 3.2s ease-in infinite;opacity:0}
.fx.steam i:nth-child(1){left:10%}.fx.steam i:nth-child(2){left:40%;animation-delay:1.05s}.fx.steam i:nth-child(3){left:70%;animation-delay:2.1s}
@keyframes steam{0%{opacity:0;transform:translateY(0) scaleX(.6)}25%{opacity:.7}100%{opacity:0;transform:translateY(-120%) scaleX(1.4)}}
.fx.bubbles{width:var(--r,22%);height:calc(var(--r,22%)*1.1)}
.fx.bubbles i{position:absolute;right:0;height:16%;border-radius:8px;background:#3ED6CE;box-shadow:0 0 10px rgba(62,214,206,.7);opacity:0;animation:bub 4.5s ease infinite}
.fx.bubbles i:nth-child(1){top:10%;width:70%}.fx.bubbles i:nth-child(2){top:38%;width:90%;animation-delay:.6s}.fx.bubbles i:nth-child(3){top:66%;width:55%;animation-delay:1.2s}
@keyframes bub{0%{opacity:0;transform:translateY(8px) scale(.9)}12%,75%{opacity:.9;transform:none}90%,100%{opacity:0}}
.fx.dust{left:0;top:0;width:100%;height:100%;transform:none}
.fx.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(242,247,247,.75);box-shadow:0 0 6px rgba(62,214,206,.8);animation:dust linear infinite;opacity:0}
.fx.glint{width:var(--r,12%);aspect-ratio:1;border-radius:50%;overflow:hidden}
.fx.glint::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);transform:translateX(-120%);animation:glint 3.6s ease-in-out infinite}
@keyframes glint{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}15%{opacity:.8}85%{opacity:.6}100%{opacity:0;transform:translate(14px,-60px)}}
.art .tm{position:absolute;left:14px;top:12px;padding:5px 12px;border-radius:99px;background:rgba(5,9,11,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:14px;font-weight:700;color:var(--text)}
.art .tm b{color:var(--acc);font-weight:800}
.float .ph svg{animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

h1{font-size:clamp(30px,8.6vw,38px);line-height:1.1;font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(24px,6.8vw,30px);line-height:1.15;font-weight:800;letter-spacing:-.02em}
h3{font-size:17px;font-weight:700;margin-bottom:8px}
.lead{color:var(--muted);margin-top:10px}
.txt{font-size:17px;line-height:1.5;color:var(--soft)}
.sp{flex:1;min-height:16px}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:12px 20px;border-radius:16px;border:1px solid transparent;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer;-webkit-appearance:none;appearance:none;transition:filter .2s,opacity .2s,border-color .2s,background-color .2s}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.hero:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.pri{background:var(--acc);color:var(--on-acc)}
.pri:hover{filter:brightness(1.06)}
.pri[disabled]{opacity:.35;cursor:default;filter:none}
.sec{background:transparent;border-color:var(--line2);color:var(--text)}
.sec:hover{border-color:var(--acc)}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.mt{margin-top:10px}
.small{font-size:13px;color:var(--muted)}

/* варианты ответа */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:16px;line-height:1.4;cursor:pointer;transition:border-color .2s,background-color .2s,opacity .3s}
.opt:hover{border-color:var(--line2)}
.opt.sel{border-color:var(--acc);background:rgba(62,214,206,.08)}
.opts.done .opt{cursor:default}
.opts.done .opt:not(.sel){opacity:.35}
.reply{display:flex;gap:10px;align-items:flex-start;margin-top:14px;animation:in .45s ease both}
.ava{width:40px;height:40px;border-radius:50%;flex:none;background:#0C1618 center/70% no-repeat;border:1px solid var(--line2);overflow:hidden;position:relative}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bub{flex:1;padding:12px 14px;border-radius:4px 16px 16px 16px;background:var(--card2);border:1px solid var(--line2);font-size:15.5px;line-height:1.45;color:var(--soft)}
.bub .who{display:block;font-size:12.5px;font-weight:700;color:var(--acc);margin-bottom:3px}
.msg{margin-top:12px;padding:12px 14px;border-radius:16px 16px 16px 4px;background:var(--card2);border:1px solid var(--line2);font-size:16px;color:var(--text)}
.msg .who{display:block;font-size:12.5px;font-weight:700;color:var(--acc);margin-bottom:3px}

/* выбор героя */
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.hero{position:relative;padding:0;border-radius:20px;border:2px solid var(--line);background:var(--card);overflow:hidden;cursor:pointer;transition:border-color .2s}
.hero .art{margin:0;border:0;border-radius:0;max-height:none}
.hero span{display:block;padding:10px 0 12px;font-size:17px;font-weight:700;text-align:center}
.hero.sel{border-color:var(--acc);box-shadow:0 0 24px -10px rgba(62,214,206,.7)}
.lbl{margin:20px 0 10px;font-size:15px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:84px;min-height:50px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:600;cursor:pointer;transition:border-color .2s,background-color .2s}
.chip.sel{border-color:var(--acc);background:rgba(62,214,206,.08);color:var(--acc)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.days .chip{min-width:0;padding:8px 4px;line-height:1.2}
.days .chip small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.days .chip.sel small{color:var(--acc)}

/* финал */
.kick{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--acc);text-transform:uppercase;margin-bottom:6px}
.card{margin-top:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.card p{color:var(--soft)}
.card ul{margin:0;padding:0;list-style:none}
.card li{position:relative;padding-left:22px;margin-top:8px;color:var(--soft)}
.card li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.zones{display:flex;flex-direction:column;gap:10px}
.zone{display:flex;align-items:center;gap:12px}
.lamp{width:18px;height:18px;border-radius:50%;flex:none}
.lamp.g{background:var(--g);box-shadow:0 0 12px rgba(91,214,138,.6)}
.lamp.y{background:var(--y);box-shadow:0 0 12px rgba(245,196,81,.55)}
.lamp.r{background:var(--r);box-shadow:0 0 12px rgba(255,139,123,.6)}
.zone b{display:block;font-size:16px}
.zone small{display:block;font-size:13.5px;color:var(--muted)}
.hl{border-color:var(--acc);background:rgba(62,214,206,.06)}

/* кнопка-обязательство */
.hold{position:relative;width:168px;height:168px;margin:18px auto 6px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 40%,#123335,#0A1719);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hold circle{fill:none;stroke-width:8}
.hold .bg{stroke:var(--line)}
.hold .fg{stroke:var(--acc);stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(62,214,206,.6))}
.hold span{position:relative;display:block;padding:0 26px;font-size:15px;font-weight:700;line-height:1.3}
.hold.ok{background:var(--acc);color:var(--on-acc)}
.hold.ok .bg,.hold.ok .fg{stroke:transparent}
.done-t{text-align:center;font-size:18px;font-weight:700;min-height:28px;color:var(--acc);margin-top:6px}
.note{margin-top:10px;font-size:14px;color:var(--muted);text-align:center;min-height:21px}

.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.share .btn{min-height:50px;font-size:15px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.scr,.reply{animation:none}.float .ph svg{animation:none}*{transition:none!important}.fx{display:none}.art .lay img,.art .lay.fig .breath{animation:none}}
@media (min-height:820px){.art{max-height:56vh}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){

function haptic(kind){

  try { if (navigator.vibrate) navigator.vibrate(kind === "ok" ? [20, 40, 30] : 12); } catch(e){}
}
function toast(t){ var x = document.getElementById("toast"); x.textContent = t; x.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(function(){ x.classList.remove("on"); }, 2200); }

  "fin-s-f": [{ t: "dust" }, { t: "glow warm", x: 88, y: 25, r: 40 }, { t: "glint", x: 45, y: 52, r: 12, top: true }],
  "fin-o": [{ t: "dust" }, { t: "glow warm", x: 92, y: 22, r: 45 }],

};
function fxOf(slot){ var k = slot.replace(/-[mf]$/, ""); return FX[slot] || FX[k] || (/^fin-/.test(k) ? FX.fin : []); }
function fxEl(f){
  var e = el("div", "fx " + f.t);
  if (f.t === "dust") { for (var i = 0; i < 14; i++) { var d = el("i"); d.style.left = (5 + Math.random() * 90) + "%"; d.style.top = (15 + Math.random() * 80) + "%"; d.style.animationDuration = (5 + Math.random() * 5) + "s"; d.style.animationDelay = (-Math.random() * 8) + "s"; e.appendChild(d); } return e; }
  e.style.left = f.x + "%"; e.style.top = f.y + "%"; if (f.r) e.style.setProperty("--r", f.r + "%");
  if (/steam|bubbles/.test(f.t)) e.innerHTML = "<i></i><i></i><i></i>";
  return e;
}

/* Картинка слота: два слоя (фон + герой) или одна картинка; нет файлов – значок-заглушка. */
function art(slot, ico, opt){
  opt = opt || {};
  var box = el("div", "art" + (opt.cls ? " " + opt.cls : ""), '<div class="ph">' + svg(ico) + '</div>');
  if (opt.tm) box.appendChild(el("div", "tm", opt.tm));
  var src = CFG.img + slot, stage = el("div", "stage");
  function load(u, ok, bad){ var im = new Image(); im.alt = ""; im.decoding = "async"; im.onload = function(){ ok(im); }; im.onerror = bad; im.src = u; }
  function show(bgIm, heroIm){
    var bg = el("div", "lay bg"); bg.appendChild(bgIm); stage.appendChild(bg);
    var fl = el("div", "lay fxl"), ft = el("div", "lay fxt");
    if (!opt.noFx) fxOf(slot).forEach(function(f){ (f.top && heroIm ? ft : fl).appendChild(fxEl(f)); });
    stage.appendChild(fl);
    if (heroIm) { var h = el("div", "lay fig"); heroIm.className = "breath"; h.appendChild(heroIm); stage.appendChild(h); stage.appendChild(ft); }
    stage._ratio = bgIm.naturalWidth / bgIm.naturalHeight;
    if (!opt.single) { box.classList.add("whole"); var bk = el("div", "back"); bk.style.backgroundImage = "url(" + bgIm.src + ")"; box.insertBefore(bk, box.firstChild); }
    box.insertBefore(stage, box.firstChild.nextSibling); box.classList.add("ok");
    fit(box); PX.add(stage);
  }
  function full(){ load(src + ".jpg", function(im){ show(im, null); }, function(){}); }
  if (CFG.layered && !opt.single) load(src + "-hero.webp?v=" + CFG.version, function(h){ load(src + "-bg.jpg", function(b){ show(b, h); }, full); }, full);
  else full();
  return box;
}
/* Слой по размеру картинки с обрезкой «cover»: эффекты встают точно на свои места картинки. */
function fit(box){
  var st = box.querySelector(".stage"); if (!st || !st._ratio) return;
  var bw = box.clientWidth, bh = box.clientHeight; if (!bw || !bh) { requestAnimationFrame(function(){ fit(box); }); return; }
  var w = bw, h = bw / st._ratio;
  if (box.classList.contains("whole")) { if (h > bh) { h = bh; w = bh * st._ratio; } }   // 1.4: картинка целиком, по бокам – размытая копия
  else if (h < bh) { h = bh; w = bh * st._ratio; }
  st.style.width = w + "px"; st.style.height = h + "px"; st.style.left = (bw - w) / 2 + "px"; st.style.top = (bh - h) / 2 + "px";
}
window.addEventListener("resize", function(){ [].forEach.call(document.querySelectorAll(".art"), fit); });

/* Наклон: телефон – датчик, компьютер – мышь, без них – лёгкое покачивание. Фон сдвигается меньше героя. */
var PX = (function(){
  var list = [], tx = 0, ty = 0, cx = 0, cy = 0, last = 0, base = null, on = false;
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(t){
    list = list.filter(function(s){ return document.body.contains(s); });
    if (!list.length) { on = false; return; }
    if (Date.now() - last > 2500) { tx = Math.sin(t / 2600) * .5; ty = Math.cos(t / 3400) * .35; }
    cx += (tx - cx) * .06; cy += (ty - cy) * .06;
    list.forEach(function(s){
      var b = s.querySelector(".bg"), f = s.querySelector(".fxl"), h = s.querySelector(".fig");
      var tb = "translate3d(" + (-cx * 5).toFixed(2) + "px," + (-cy * 4).toFixed(2) + "px,0) scale(1.03)";
      if (b) b.style.transform = tb; if (f) f.style.transform = tb;
      var th = "translate3d(" + (cx * 7).toFixed(2) + "px," + (cy * 4).toFixed(2) + "px,0) scale(1.03)";
      if (h) h.style.transform = th; var t2 = s.querySelector(".fxt"); if (t2) t2.style.transform = th;
    });
    requestAnimationFrame(loop);
  }
  function input(x, y){ tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); last = Date.now(); }
  window.addEventListener("deviceorientation", function(e){
    if (e.gamma == null) return;
    if (!base) base = { g: e.gamma, b: e.beta };
    input((e.gamma - base.g) / 20, (e.beta - base.b) / 25);
  });
  window.addEventListener("pointermove", function(e){ if (e.pointerType === "mouse") input(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); });
  return {
    add: function(s){ if (still) return; list.push(s); if (!on) { on = true; requestAnimationFrame(loop); } },
    ask: function(){ try { if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") DeviceOrientationEvent.requestPermission().catch(function(){}); } catch(e){} }
  };
})();
function avatar(){

  return a;

function top(progress, label){

/* 1.4: фоновая музыка – включается кнопкой «Начать» (браузеры не дают играть звук без нажатия), выключается кнопкой вверху. */
var MUS = (function(){
  var a = null, want = true, M = { ok: false };
  try { want = localStorage.getItem("lf_game_snd") !== "0"; } catch(e){}
  var I_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var I_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function paint(){ [].forEach.call(document.querySelectorAll(".snd"), function(b){ var on = want && a && !a.paused; b.classList.toggle("on", on); b.innerHTML = on ? I_ON : I_OFF; b.setAttribute("aria-label", on ? "Выключить музыку" : "Включить музыку"); }); }
  if (CFG.music) {
    a = new Audio(); a.loop = true; a.preload = "auto"; a.volume = .35;
    a.oncanplaythrough = function(){ if (!M.ok) { M.ok = true; [].forEach.call(document.querySelectorAll(".top"), function(t){ if (!t.querySelector(".snd")) t.appendChild(M.btn()); }); } };
    a.onplay = a.onpause = paint;
    a.src = CFG.music;
  }
  M.start = function(){ if (a && want) { var p = a.play(); if (p && p.catch) p.catch(function(){}); } };
  M.btn = function(){ var b = el("button", "snd"); b.type = "button"; b.onclick = function(){ want = !(want && !a.paused); try { localStorage.setItem("lf_game_snd", want ? "1" : "0"); } catch(e){} if (want) M.start(); else a.pause(); paint(); }; setTimeout(paint, 0); return b; };
  document.addEventListener("visibilitychange", function(){ if (!a) return; if (document.hidden) a.pause(); else if (want && M.started) M.start(); });
  return M;
})();

  }

/* Тип игрока: больше всех очков; при равенстве – по порядку В, С, О, Р; все ответы нейтральные – «Вечно занятый». */
function typeOf(){
  var best = "v", max = -1;
  ORDER.forEach(function(k){ if (S.sc[k] > max) { max = S.sc[k]; best = k; } });
  return { k: best, zero: max <= 0 };
}
/* Название типа: для героини – в женском роде («Вечно занятая», «Осторожная»). */
function tname(k){ var T = TYPES[k]; return S.g === "f" && T.nameF ? T.nameF : T.name; }
function lampOf(n){ return n >= 3 ? "r" : n >= 1 ? "y" : "g"; }

/* Кнопка «Зажмите, чтобы закрепить»: кольцо заполняется за 2 секунды, отпустили раньше – сбрасывается. */
function holdBtn(onDone){
  var R = 76, L = 2 * Math.PI * R, MS = 2000;
  var b = el("button", "hold", '<svg viewBox="0 0 168 168" aria-hidden="true"><circle class="bg" cx="84" cy="84" r="' + R + '"/><circle class="fg" cx="84" cy="84" r="' + R + '" stroke-dasharray="' + L + '" stroke-dashoffset="' + L + '"/></svg><span>Зажмите, чтобы закрепить</span>');
  b.type = "button"; b.setAttribute("aria-label", "Зажмите и держите 2 секунды, чтобы закрепить день");
  var fg = b.querySelector(".fg"), lab = b.querySelector("span"), t0 = 0, raf = 0, ok = false;
  function paint(p){ fg.setAttribute("stroke-dashoffset", String(L * (1 - p))); }
  function tick(){
    var p = Math.min((Date.now() - t0) / MS, 1); paint(p);
    if (p >= 1) { ok = true; t0 = 0; b.classList.add("ok"); lab.textContent = "Закреплено"; onDone(); return; }
    raf = requestAnimationFrame(tick);
  }
  function start(e){ if (b.disabled || ok) return; if (e && e.cancelable) e.preventDefault(); t0 = Date.now(); haptic(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
  function stop(){ if (ok || !t0) return; t0 = 0; cancelAnimationFrame(raf); paint(0); }
  b.addEventListener("pointerdown", function(e){ try { b.setPointerCapture(e.pointerId); } catch(x){} start(e); });
  b.addEventListener("pointerup", stop); b.addEventListener("pointercancel", stop); b.addEventListener("lostpointercapture", stop);
  b.addEventListener("keydown", function(e){ if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); });
  b.addEventListener("keyup", function(e){ if (e.key === " " || e.key === "Enter") stop(); });
  b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  return { el: b, reset: function(){ ok = false; t0 = 0; cancelAnimationFrame(raf); paint(0); b.classList.remove("ok"); lab.textContent = "Зажмите, чтобы закрепить"; } };
}

    "1-я тренировка " + WD[S.day.getDay()].toLowerCase() + " " + dd(S.day)].join(" · ").slice(0, 100);

function copy(t){
  function ok(){ toast("Ссылка скопирована"); }
  try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(ok, fb); return; } } catch(e){}
  fb();
  function fb(){ var x = el("textarea"); x.value = t; x.style.position = "fixed"; x.style.opacity = "0"; document.body.appendChild(x); x.select(); try { document.execCommand("copy"); ok(); } catch(e){ toast("Не получилось скопировать"); } document.body.removeChild(x); }
}
function saveBlob(b){
  var u = URL.createObjectURL(b), a = el("a"); a.href = u; a.download = "lite-fit-odin-den.png"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); document.body.removeChild(a); }, 1000);
}
function shareNative(text, link){
  cardBlob(function(b){
    var data = { title: "Один день после 30", text: text + " " + link };
    try {
      if (b) { var f = new File([b], "lite-fit-odin-den.png", { type: "image/png" }); if (navigator.canShare && navigator.canShare({ files: [f] })) data.files = [f]; }
    } catch(e){}
    navigator.share(data).catch(function(){});
  });
}

/* Карточка для друзей 1080×1350: картинка финала (если есть), тип, «А Вы?». */
function cardBlob(cb){
  var W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  var x = c.getContext("2d"), T = TYPES[S.type];
  function load(src, fn){ var im = new Image(); im.onload = function(){ fn(im); }; im.onerror = function(){ fn(null); }; im.src = src; }
  function rr(px, py, w, h, r){ x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); }
  function wrap(t, px, py, maxW, lh){ var words = t.split(" "), line = "", y = py; words.forEach(function(w){ var test = line ? line + " " + w : w; if (x.measureText(test).width > maxW && line) { x.fillText(line, px, y); line = w; y += lh; } else line = test; }); x.fillText(line, px, y); return y; }
  var fonts = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 80px "Manrope"'), document.fonts.load('600 40px "Manrope"')]) : Promise.resolve();
  fonts.catch(function(){}).then(function(){
    var icoSrc = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 24 24" fill="none" stroke="#3ED6CE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">' + ICO[S.type] + '</svg>');
    load(LOGO, function(logo){ load(icoSrc, function(ico){ load(CFG.img + "fin-" + S.type + "-" + S.g + ".jpg", function(pic){
      x.fillStyle = "#05090B"; x.fillRect(0, 0, W, H);
      var g = x.createRadialGradient(W / 2, 420, 40, W / 2, 420, 760); g.addColorStop(0, "rgba(62,214,206,.28)"); g.addColorStop(1, "rgba(62,214,206,0)");
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      if (logo) x.drawImage(logo, 72, 64, 96, 79);
      x.fillStyle = "#8FA5A7"; x.font = '700 30px "Manrope", sans-serif'; x.fillText("LITE FIT · ОДИН ДЕНЬ ПОСЛЕ 30", 190, 116);
      var top0 = 190, ih = 560;
      if (pic) {
        x.save(); rr(72, top0, W - 144, ih, 36); x.clip();
        var r = Math.max((W - 144) / pic.width, ih / pic.height), w = pic.width * r, h = pic.height * r;
        x.drawImage(pic, 72 + (W - 144 - w) / 2, top0 + (ih - h) / 2, w, h); x.restore();
      } else {
        x.save(); rr(72, top0, W - 144, ih, 36); x.fillStyle = "#0C1618"; x.fill(); x.strokeStyle = "#1E3A3C"; x.lineWidth = 3; x.stroke(); x.restore();
        if (ico) x.drawImage(ico, (W - 360) / 2, top0 + (ih - 360) / 2, 360, 360);
      }
      var y = top0 + ih + 100;
      x.fillStyle = "#F2F7F7"; x.font = '700 58px "Manrope", sans-serif'; x.fillText("Я –", 72, y);
      x.fillStyle = "#3ED6CE"; x.font = '800 84px "Manrope", sans-serif'; y = wrap("«" + tname(S.type) + "»", 72, y + 100, W - 144, 96);
      x.fillStyle = "#F2F7F7"; x.font = '800 64px "Manrope", sans-serif'; x.fillText("А Вы?", 72, y + 100);
      x.fillStyle = "#8FA5A7"; x.font = '600 34px "Manrope", sans-serif'; x.fillText("Lite Fit · игра на 3 минуты", 72, H - 64);
      try { c.toBlob(function(b){ cb(b); }, "image/png"); } catch(e){ cb(null); }
    }); }); });
  });
}

/* Telegram Mini App: развернуть на весь экран, цвет шапки. */
function tgInit(){

    if (w && w.initData !== undefined && (w.initData || w.platform !== "unknown")) {
      TG = w; w.ready(); w.expand();
      if (!ORIGIN) {                                                      // 1.5: открыто в Telegram – метка «tg» или «tg_<startapp>»

        ORIGIN = sp ? "tg_" + sp : "tg";
      }
      try { w.setHeaderColor("#05090B"); w.setBackgroundColor("#05090B"); } catch(e){}
    }
  } catch(e){}
}
tgInit(); setTimeout(tgInit, 800);
