<style>
:root{
  --bg:#05090B; --card:#0C1618; --card2:#0F1D20; --line:#1E3A3C; --line2:#2A4B4D;
  --accent:#3ED6CE; --on-accent:#04211F; --glow:rgba(62,214,206,.55);
  --warm:#FF9A52; --text:#F2F7F7; --muted:#8FA5A7; --dim:#5E7577;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --side:236px; --bar:64px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
svg{width:22px;height:22px;flex:none}
/* рабочая область: оба приложения загружены и лежат друг над другом, видно одно */
.main{position:fixed;left:0;right:0;top:var(--safe-t);bottom:calc(var(--bar) + var(--safe-b))}
.main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden}
.main iframe.on{visibility:visible;z-index:1}
.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:15px;z-index:0}
.wait img{height:60px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
/* меню */
.nav{position:fixed;z-index:20;background:rgba(5,9,11,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.nav .logo{display:none}
.nav .grp{display:none}
.nav .who{display:none}
.it{position:relative;display:flex;align-items:center;gap:12px;color:var(--dim);font-weight:700}
.it.on{color:var(--accent)}
.it .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--warm);color:#231204;font-size:10.5px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.it .cnt[hidden]{display:none}
/* телефон: меню внизу, 5 пунктов, остальное – «Ещё» */
@media (max-width:1023px){
  .nav{left:0;right:0;bottom:0;height:calc(var(--bar) + var(--safe-b));padding-bottom:var(--safe-b);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
  .nav .it{flex-direction:column;justify-content:center;gap:4px;font-size:11px;font-weight:600}
  .nav .it.side{display:none}
  .nav .it.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--glow)}
  .nav .it .cnt{position:absolute;top:7px;left:calc(50% + 8px)}
}
/* компьютер: меню слева */
@media (min-width:1024px){
  .main{left:var(--side);top:0;bottom:0}
  .nav{left:0;top:0;bottom:0;width:var(--side);border-right:1px solid var(--line);padding:20px 12px 16px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .nav .logo{display:block;padding:2px 10px 18px}
  .nav .logo img{height:42px;width:auto;display:block}
  .nav .grp{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:14px 12px 6px}
  .nav .it{min-height:46px;padding:0 12px;border-radius:13px;font-size:15px;transition:background .15s,color .15s}
  .nav .it:hover{background:rgba(255,255,255,.03);color:var(--muted)}
  .nav .it.on{background:var(--card2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line2)}
  .nav .it .lb{flex:1;text-align:left}
  .nav .it.more{display:none}
  .nav .who{display:block;margin-top:auto;padding:14px 12px 0;font-size:12px;color:var(--dim);border-top:1px solid var(--line)}
  .nav .who b{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
}
/* «Ещё» на телефоне */
.more-sh{position:fixed;inset:0;z-index:30;background:rgba(3,6,7,.7);display:flex;align-items:flex-end}
.more-sh[hidden]{display:none}
.more-in{width:100%;background:var(--card);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:10px 14px calc(var(--safe-b) + 14px)}
.more-in .h{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 10px;font-weight:800}
.more-in .h button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.more-in .it{width:100%;min-height:54px;padding:0 10px;border-top:1px solid var(--line);font-size:16px;color:var(--text)}
.more-in .it .lb{flex:1;text-align:left}
.more-in .it svg{color:var(--accent)}
</style>
</head>

  free: ic('<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8.5V20"/><path d="M12 8.5c-1.5-3.5-5.5-4-5.5-1.5S10 8.5 12 8.5zM12 8.5c1.5-3.5 5.5-4 5.5-1.5S14 8.5 12 8.5z"/>'),
  fresh: ic('<circle cx="10" cy="8" r="3.4"/><path d="M3.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M19 6.5v6M16 9.5h6"/>'),
  tasks: ic('<path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.2 1.2L7.2 5M4 12l1.2 1.2 2-2.2M4 18l1.2 1.2 2-2.2"/>'),
  train: ic('<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>'),
  cal: ic('<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  coms: ic('<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/>'),
  base: ic('<path d="M4 6h16M4 12h16M4 18h10"/>'),
  fsets: ic('<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5V20h14v-7.5M12 8.5V20"/><path d="M12 8.5c-1.5-3.5-5.5-4-5.5-1.5S10 8.5 12 8.5zM12 8.5c1.5-3.5 5.5-4 5.5-1.5S14 8.5 12 8.5z"/>'),
  more: ic('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'),
  x: ic('<path d="M6 6l12 12M18 6L6 18"/>')
};
// раздел: [код, название, приложение, на телефоне – внизу]
var SECS = [['home', 'Сегодня', 'A', 1], ['clients', 'Клиенты', 'A', 1], ['free', 'Free', 'A', 1], ['fresh', 'Новые', 'A', 0], ['tasks', 'Задачи', 'A', 0],
  ['train', 'Тренировки', 'B', 1], ['cal', 'Календарь', 'B', 0], ['coms', 'Комментарии', 'B', 0], ['base', 'База упражнений', 'B', 0], ['fsets', 'Наборы FREE', 'B', 0]];
function secOf(s) { return SECS.filter(function (x) { return x[0] === s; })[0] || null; }
var main = document.getElementById('main'), navEl = document.getElementById('nav'), moreEl = document.getElementById('more');
var F = { A: null, B: null }, READY = { A: false, B: false }, AUTH = { A: '', B: '' }, PENDING = { A: [], B: [] };
var BADGE = {}, CUR = '', TRAINER = '', ADMIN = false, WANT = '';

/* ---------- приложения в рамках ---------- */
function srcOf(app) {
  var s0 = appOf(CUR) === app ? '&s=' + CUR : '';
  if (app === 'A') return 'trainer-app.html?embed=1&t=' + encodeURIComponent(KEY) + s0;
  var u = '../trening/?embed=1&t=' + encodeURIComponent(KEY) + s0;
  ['w', 'i', 'c'].forEach(function (k) { if (qs.get(k)) u += '&' + k + '=' + encodeURIComponent(qs.get(k)); });
  return u;
}
function load(app) {
  if (F[app]) return;
  var f = document.createElement('iframe');
  f.title = app === 'A' ? 'Кабинет тренера' : 'Тренировки';
  f.src = srcOf(app);
  f.addEventListener('load', function () {
    READY[app] = true;
    var q = PENDING[app]; PENDING[app] = [];
    q.forEach(function (m) { send(app, m); });
    var w = document.getElementById('wait'); if (w && app === appOf(CUR)) w.remove();
  });
  main.appendChild(f);
  F[app] = f;
  paintFrames();
}
function reload(app) { if (!F[app]) return load(app); READY[app] = false; AUTH[app] = ''; F[app].src = srcOf(app); }
function send(app, m) {
  if (!F[app] || !READY[app]) { PENDING[app].push(m); return; }
  m.lf = 1; m.to = app;
  try { F[app].contentWindow.postMessage(m, location.origin); } catch (e) {}
}
function appOf(s) { var x = secOf(s); return x ? x[2] : 'A'; }
function hasDev() { return !!LS.get(DEVK); }
function paintFrames() {
  var a = appOf(CUR);
  ['A', 'B'].forEach(function (k) { if (F[k]) F[k].classList.toggle('on', k === a); });
}

/* ---------- переходы ---------- */
function go(s, opt) {
  opt = opt || {};
  if (!secOf(s)) s = 'home';
  var app = appOf(s);
  if (app === 'B' && AUTH.A !== 'ok' && !hasDev()) { s = 'home'; app = 'A'; }   // ПИН-код ещё не введён – сначала кабинет
  CUR = s;
  if (!F[app]) load(app);
  paintFrames();
  if (!opt.silent) send(app, { type: 'nav', s: s, force: !!opt.force });
  paintNav();
  closeMore();
  try { history.replaceState(null, '', location.pathname + (qs.get('t') ? '?t=' + encodeURIComponent(KEY) : '') + '#' + s); } catch (e) {}
}
function paintNav() {
  var cur = secOf(CUR) || SECS[0], moreN = 0, moreOn = !cur[3];
  var it = function (x, cls) {
    var n = BADGE[x[0]] || 0;
    if (!x[3]) moreN += n;
    return '<button class="it ' + (cls || '') + (CUR === x[0] ? ' on' : '') + '" data-s="' + x[0] + '" aria-current="' + (CUR === x[0] ? 'page' : 'false') + '">' + I[x[0]] + '<span class="lb">' + x[1] + '</span>' +
      '<span class="cnt num"' + (n ? '' : ' hidden') + '>' + n + '</span></button>';
  };
  var h = '<span class="logo"><img src="' + LOGO + '" alt="Lite Fit"></span><span class="grp">Кабинет</span>';
  SECS.forEach(function (x, i) {
    if (i === 5) h += '<span class="grp">Тренировки</span>';
    h += it(x, x[3] ? '' : 'side');
  });
  h += '<button class="it more' + (moreOn ? ' on' : '') + '" data-more="1">' + I.more + '<span class="lb">Ещё</span><span class="cnt num"' + (moreN ? '' : ' hidden') + '>' + moreN + '</span></button>';
  h += '<div class="who">' + (TRAINER ? '<b>' + esc(TRAINER) + '</b>' : '') + 'Кабинет тренера · ' + VERSION + '</div>';
  // на телефоне внизу: 4 главных раздела + «Ещё»; на компьютере – все разделы
  navEl.innerHTML = h;
  if (!moreEl.hidden) openMore();
}
function openMore() {
  moreEl.hidden = false;
  moreEl.innerHTML = '<div class="more-in"><div class="h"><span>Разделы</span><button data-close="1" aria-label="Закрыть">' + I.x + '</button></div>' +
    SECS.filter(function (x) { return !x[3]; }).map(function (x) {
      var n = BADGE[x[0]] || 0;
      return '<button class="it' + (CUR === x[0] ? ' on' : '') + '" data-s="' + x[0] + '">' + I[x[0]] + '<span class="lb">' + x[1] + '</span><span class="cnt num"' + (n ? '' : ' hidden') + '>' + n + '</span></button>';
    }).join('') + '</div>';
}
function closeMore() { moreEl.hidden = true; moreEl.innerHTML = ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-s],[data-more],[data-close]') : null;
  if (!b) { if (e.target === moreEl) closeMore(); return; }
  if (b.hasAttribute('data-more')) return moreEl.hidden ? openMore() : closeMore();
  if (b.hasAttribute('data-close')) return closeMore();
  var s = b.getAttribute('data-s');
  go(s, { force: s === CUR });
});

/* ---------- сообщения от приложений ---------- */
window.addEventListener('message', function (e) {
  if (e.origin !== location.origin || !e.data || e.data.lf !== 1 || !e.data.app || e.data.to) return;
  var m = e.data, app = m.app;
  if (m.type === 'badges' && m.b) {
    Object.keys(m.b).forEach(function (k) { BADGE[k] = Number(m.b[k]) || 0; });
    paintNav();
  } else if (m.type === 'sec') {
    if (appOf(CUR) === app && secOf(m.s) && m.s !== CUR) { CUR = m.s; paintNav(); try { history.replaceState(null, '', location.pathname + (qs.get('t') ? '?t=' + encodeURIComponent(KEY) : '') + '#' + CUR); } catch (er) {} }
  } else if (m.type === 'auth') {
    var was = AUTH[app];
    AUTH[app] = m.state;
    if (m.trainer) { TRAINER = m.trainer; paintNav(); }
    if (app === 'A' && m.state === 'ok') {
      if (WANT) { var wnt = WANT; WANT = ''; go(wnt); }                    // шли в тренировки, а сначала нужен был ПИН-код
      if (!F.B) setTimeout(function () { load('B'); }, appOf(CUR) === 'B' ? 0 : 1200);
      else if (AUTH.B === 'pin') reload('B');                             // ПИН-код только что введён в кабинете – тренировки откроются без него
    }
    if (m.state === 'pin' || m.state === 'key') {
      if (app === 'B' && AUTH.A === 'ok' && hasDev() && was !== 'pin') { reload('B'); return; }
      if (app === 'B' && appOf(CUR) === 'B') go('home');
    }
  } else if (m.type === 'go' && secOf(m.s)) {
    go(m.s, { silent: !!m.cid });
    if (m.cid) send(appOf(m.s), { type: 'open', cid: String(m.cid) });
  }
});

/* ---------- старт ---------- */
(function start() {
  var s = (location.hash || '').replace(/^#/, '') || qs.get('s') || 'home';
  if (qs.get('w')) s = 'train';
  if (!secOf(s)) s = 'home';
  if (appOf(s) === 'B' && !hasDev()) { WANT = s; s = 'home'; }
  CUR = s;
  paintNav();
  load('A');
  if (appOf(s) === 'B') load('B');
  send(appOf(s), { type: 'nav', s: s });
  if (hasDev() && !F.B) setTimeout(function () { load('B'); }, 2500);
})();
})();
</script>
