<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lite Fit – 3 тренировки бесплатно</title>
<style>
  :root { --bg:#05090b; --fg:#fff; --muted:#b9c4c4; --turq:#3ed6ce; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:Montserrat, Manrope, Arial, sans-serif; padding:24px 16px; }
  main { max-width:420px; width:100%; text-align:center; }
  h1 { font-size:26px; line-height:1.2; margin:0 0 12px; }
  h1 span { color:var(--turq); }
  p { color:var(--muted); font-size:16px; line-height:1.45; margin:0 0 24px; }
  a.btn { display:block; background:var(--turq); color:#05090b; text-decoration:none; font-weight:700;
          font-size:17px; padding:16px 20px; border-radius:14px; }
  small { display:block; margin-top:18px; color:#7d8a8a; font-size:13px; }
</style>
<script>
  // счётчик Top@Mail.ru 3813680 (VK Реклама): просмотр страницы и выбор кнопки
  var _tmr = window._tmr || (window._tmr = []);
  _tmr.push({ id: '3813680', type: 'pageView', start: (new Date()).getTime() });
  (function (d, w, id) { if (d.getElementById(id)) return; var ts = d.createElement('script'); ts.async = true; ts.id = id;
    ts.src = 'https://top-fwz1.mail.ru/js/code.js'; var s = d.getElementsByTagName('script')[0]; s.parentNode.insertBefore(ts, s); })(document, window, 'tmr-code');
  function tmrGoal(g) { try { _tmr.push({ id: '3813680', type: 'reachGoal', goal: g }); } catch (e) {} }
</script>
</head>
<body>
<main>
  <h1>3 тренировки бесплатно – <span>и тренер видит каждую</span></h1>
  <p>Открываем чат Lite Fit во ВКонтакте – там подберём тренировки за минуту.</p>
  <a class="btn" id="go" href="https://vk.me/lite_fit_online">Открыть чат ВКонтакте</a>
  <small>Если чат не открылся сам, нажмите на кнопку.</small>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var out = new URLSearchParams();
    ['ref', 'ref_source'].forEach(function (k) { if (q.get(k)) out.set(k, q.get(k)); });
    if (!out.get('ref')) out.set('ref', 'go_site');
    var ref = out.get('ref');
    var url = 'https://vk.me/lite_fit_online?' + out.toString();
    if (/^ny[_-]/i.test(ref) && q.get('choice') !== '1') {               // NY6 (с 24.11): тест прямо на странице
      tmrGoal('ny_go_page');
      location.replace('../test/?ref=' + encodeURIComponent(ref));
      return;
    }
    if (/^ny[_-]/i.test(ref)) {                                         // NY6: старый экран выбора (?choice=1)
      var tg = 'https://t.me/LiteFitClientBot?start=' + encodeURIComponent(ref.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64));
      document.title = 'Lite Fit – тест за 2 минуты';
      document.querySelector('h1').innerHTML = '6 недель с тренером – <span>тест за 2 минуты</span>';
      document.querySelector('p').textContent = '7 вопросов – и Вы узнаете, что мешает именно Вам и с чего начать до Нового года. Где удобнее пройти?';
      var go = document.getElementById('go');
      go.href = url; go.textContent = 'Пройти во ВКонтакте';
      tmrGoal('ny_go_page');
      go.addEventListener('click', function () { tmrGoal('ny_go_vk'); });
      var t = document.createElement('a'); t.className = 'btn'; t.href = tg; t.textContent = 'Пройти в Telegram';
      t.style.marginTop = '12px'; t.style.background = '#fff';
      t.addEventListener('click', function () { tmrGoal('ny_go_tg'); });
      go.parentNode.insertBefore(t, go.nextSibling);
      document.querySelector('small').textContent = 'Во ВКонтакте после перехода нажмите «Начать». Бесплатно, без регистрации.';
      return;
    }
    document.getElementById('go').href = url;
    setTimeout(function () { location.replace(url); }, 300);
  })();
</script>
</body>
</html>
