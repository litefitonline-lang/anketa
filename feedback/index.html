<style>
#lf-anketa{--bg:#05090B;--card:#0C1618;--line:#1E3A3C;--line2:#2A4B4D;--accent:#3ED6CE;--on-accent:#04211F;--text:#F2F7F7;--muted:#8FA5A7;--badge:#FF9A52;--badge-bg:#3A2210;--err:#FF8B7B;box-sizing:border-box!important;width:100%!important;max-width:480px!important;margin:0 auto!important;padding:28px 20px 36px!important;background:#05090B!important;color:#F2F7F7!important;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif!important;font-size:16px!important;line-height:1.5!important;text-align:left!important;-webkit-font-smoothing:antialiased!important;scroll-margin-top:16px!important}
#lf-anketa.in-taplink{padding:8px 0 16px!important;background:transparent!important}
#lf-anketa *,#lf-anketa *::before,#lf-anketa *::after{box-sizing:border-box!important}
#lf-anketa *{color:inherit!important;font-family:inherit!important;letter-spacing:normal;text-transform:none!important;text-shadow:none!important}
#lf-anketa p,#lf-anketa h2{margin:0!important}

/* демо-плашка */
#lf-anketa .lf-home{display:inline-flex!important;align-items:center!important;gap:4px!important;margin:0 0 18px -6px!important;padding:6px!important;font-size:14px!important;color:#8FA5A7!important;text-decoration:none!important}
#lf-anketa .lf-home svg{width:18px!important;height:18px!important}
#lf-anketa .lf-demo{margin:0 0 20px!important;padding:10px 14px!important;border-radius:12px!important;background:#3A2210!important;color:#FF9A52!important;font-size:13px!important;line-height:1.4!important}

/* прогресс */
#lf-anketa .lf-progress{display:flex!important;align-items:center!important;margin-bottom:14px!important;padding:4px 2px!important}
#lf-anketa .lf-dot{flex:none!important;width:44px!important;height:36px!important;background-color:transparent!important;background-position:center!important;background-size:contain!important;background-repeat:no-repeat!important;filter:grayscale(1) brightness(.7)!important;opacity:.28!important;transition:filter .4s,opacity .4s,transform .4s!important}
#lf-anketa .lf-dot.done{filter:none!important;opacity:.8!important}
#lf-anketa .lf-dot.now{filter:drop-shadow(0 0 6px rgba(62,214,206,.75)) drop-shadow(0 0 14px rgba(62,214,206,.35))!important;opacity:1!important;transform:scale(1.08)!important}
#lf-anketa .lf-link{flex:1!important;height:2px!important;min-width:4px!important;margin:0 4px!important;border-radius:2px!important;background:#1E3A3C!important;transition:background .4s!important}
#lf-anketa .lf-link.done{background:#3ED6CE!important}
#lf-anketa .lf-stepnum{font-size:13px!important;color:#8FA5A7!important;margin-bottom:22px!important}
@media (max-width:360px){#lf-anketa .lf-dot{width:38px!important;height:31px!important}#lf-anketa .lf-link{margin:0 3px!important}}
#lf-anketa .lf-note{margin:-8px 0 20px!important;padding:14px 16px!important;border-radius:16px!important;border:1px solid #2A4B4D!important;background:rgba(62,214,206,.05)!important;font-size:14px!important;line-height:1.5!important}
#lf-anketa .lf-note b{color:#3ED6CE!important;font-weight:700!important}

/* заголовок шага */
#lf-anketa .lf-title{font-size:clamp(26px,7.4vw,32px)!important;line-height:1.15!important;font-weight:800!important;letter-spacing:-.02em!important;margin-bottom:10px!important}
#lf-anketa .lf-lead{color:#8FA5A7!important;font-size:16px!important;margin-bottom:28px!important;max-width:40ch!important}

/* вопрос */
#lf-anketa .lf-q{margin-bottom:28px!important}
#lf-anketa .lf-label{display:block!important;font-size:17px!important;font-weight:700!important;line-height:1.35!important;margin-bottom:4px!important}
#lf-anketa .lf-opt-mark{display:block!important;font-weight:500!important;font-size:13px!important;color:#8FA5A7!important;margin-top:2px!important}
#lf-anketa .lf-hint{font-size:13px!important;color:#8FA5A7!important;margin-bottom:12px!important}
#lf-anketa .lf-label + .lf-control{margin-top:12px!important}
#lf-anketa .lf-err{display:none!important;font-size:13px!important;color:#FF8B7B!important;margin-top:8px!important}
#lf-anketa .lf-q.invalid .lf-err{display:block!important}
#lf-anketa .lf-q.invalid .lf-input,#lf-anketa .lf-q.invalid .lf-choice{border-color:rgba(255,139,123,.55)!important}

/* поля ввода */
#lf-anketa .lf-input{display:block!important;width:100%!important;min-height:54px!important;margin:0!important;padding:14px 16px!important;background:#0C1618!important;border:1px solid #1E3A3C!important;border-radius:16px!important;color:#F2F7F7!important;font:inherit!important;font-size:16px!important;line-height:1.4!important;outline:none!important;-webkit-appearance:none!important;appearance:none!important;box-shadow:none!important;transition:border-color .2s!important}
#lf-anketa textarea.lf-input{min-height:108px!important;resize:vertical!important}
#lf-anketa .lf-input::placeholder{color:#5E7577!important;opacity:1!important}
#lf-anketa .lf-input:focus{border-color:#3ED6CE!important}
#lf-anketa .lf-params{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important}
#lf-anketa .lf-param{position:relative!important}
#lf-anketa .lf-param .lf-input{padding-top:24px!important;padding-bottom:8px!important}
#lf-anketa .lf-param small{position:absolute!important;left:17px!important;top:8px!important;font-size:12px!important;color:#8FA5A7!important;pointer-events:none!important}

/* варианты ответа */
#lf-anketa .lf-choices{display:flex!important;flex-direction:column!important;gap:8px!important}
#lf-anketa .lf-choice{position:relative!important;display:flex!important;align-items:flex-start!important;gap:14px!important;width:100%!important;min-height:54px!important;margin:0!important;padding:15px 16px!important;background:#0C1618!important;border:1px solid #1E3A3C!important;border-radius:16px!important;color:#F2F7F7!important;font:inherit!important;font-size:16px!important;line-height:1.4!important;text-align:left!important;cursor:pointer!important;-webkit-appearance:none!important;appearance:none!important;transition:border-color .2s,background-color .2s!important}
#lf-anketa .lf-choice:hover{border-color:#2A4B4D!important}
#lf-anketa .lf-choice:focus-visible{outline:2px solid #3ED6CE!important;outline-offset:2px!important}
#lf-anketa .lf-choice.sel{border-color:#3ED6CE!important;background:rgba(62,214,206,.06)!important}
#lf-anketa .lf-ind{flex:none!important;width:22px!important;height:22px!important;margin-top:0!important;border:2px solid #2A4B4D!important;border-radius:50%!important;display:grid!important;place-items:center!important;transition:all .2s!important}
#lf-anketa .lf-choice[role="checkbox"] .lf-ind{border-radius:7px!important}
#lf-anketa .lf-choice.sel .lf-ind{border-color:#3ED6CE!important}
#lf-anketa .lf-choice[role="radio"].sel .lf-ind::after{content:""!important;width:10px!important;height:10px!important;border-radius:50%!important;background:#3ED6CE!important}
#lf-anketa .lf-choice[role="checkbox"].sel .lf-ind{background:#3ED6CE!important}
#lf-anketa .lf-choice[role="checkbox"].sel .lf-ind::after{content:""!important;width:10px!important;height:6px!important;border-left:2.5px solid #04211F!important;border-bottom:2.5px solid #04211F!important;transform:translateY(-1px) rotate(-45deg)!important}
#lf-anketa .lf-ctext{flex:1!important;min-width:0!important}
#lf-anketa .lf-csub{display:block!important;font-size:13px!important;color:#8FA5A7!important;margin-top:2px!important}
#lf-anketa .lf-other{margin-top:8px!important;display:none!important}
#lf-anketa .lf-other.show{display:block!important}

/* карточки тарифов */
#lf-anketa .lf-plan{padding:18px 18px!important}
#lf-anketa .lf-plan .lf-ind{margin-top:2px!important}
#lf-anketa .lf-tagrow{display:flex!important;align-items:center!important;gap:8px!important;margin-bottom:4px!important}
#lf-anketa .lf-tag{font-size:13px!important;font-weight:700!important;letter-spacing:.06em!important;color:#3ED6CE!important}
#lf-anketa .lf-badge{font-size:12px!important;font-weight:600!important;color:#FF9A52!important;background:#3A2210!important;padding:3px 9px!important;border-radius:99px!important}
#lf-anketa .lf-ptitle{display:block!important;font-size:18px!important;font-weight:700!important;line-height:1.3!important}

/* согласие */
#lf-anketa .lf-consent{font-size:15px!important}
#lf-anketa .lf-consent a{color:#F2F7F7!important;text-decoration:underline!important;text-underline-offset:3px!important;text-decoration-color:#2A4B4D!important}

/* кнопки */
#lf-anketa .lf-nav{display:flex!important;gap:10px!important;margin-top:8px!important}
#lf-anketa .lf-btn{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:10px!important;height:54px!important;margin:0!important;padding:0 22px!important;border-radius:16px!important;border:1px solid transparent!important;font:inherit!important;font-size:16px!important;font-weight:700!important;text-decoration:none!important;cursor:pointer!important;-webkit-appearance:none!important;appearance:none!important;transition:filter .2s,border-color .2s,opacity .2s!important}
#lf-anketa .lf-btn:focus-visible{outline:2px solid #3ED6CE!important;outline-offset:3px!important}
#lf-anketa .lf-primary{flex:1!important;background:#3ED6CE!important;color:#04211F!important}
#lf-anketa .lf-primary:hover{filter:brightness(1.06)!important}
#lf-anketa .lf-primary[disabled]{opacity:.6!important;cursor:progress!important}
#lf-anketa .lf-secondary{background:transparent!important;color:#F2F7F7!important;border-color:#2A4B4D!important}
#lf-anketa .lf-secondary:hover{border-color:#3ED6CE!important}
#lf-anketa .lf-btn svg{width:20px!important;height:20px!important;flex:none!important}
#lf-anketa .lf-back{width:54px!important;padding:0!important}
#lf-anketa .lf-senderr{display:none!important;margin-top:14px!important;font-size:14px!important;color:#FF8B7B!important}
#lf-anketa .lf-senderr.show{display:block!important}
#lf-anketa .lf-senderr a{color:#F2F7F7!important}

/* экран «отправлено» */
#lf-anketa .lf-done{text-align:center!important;padding-top:12px!important}
#lf-anketa .lf-done-ico{width:72px!important;height:72px!important;margin:0 auto 24px!important;border-radius:50%!important;border:1px solid #2A4B4D!important;background:#0C1618!important;display:grid!important;place-items:center!important}
#lf-anketa .lf-done-ico svg{width:32px!important;height:32px!important}
#lf-anketa .lf-done .lf-lead{margin:0 auto 28px!important}
#lf-anketa .lf-done .lf-btn{width:100%!important;margin-bottom:10px!important}

/* смена шага */
#lf-anketa .lf-step{animation:lfIn .35s ease both!important}
@keyframes lfIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#lf-anketa .lf-step{animation:none!important}#lf-anketa *{transition:none!important}}
</style>

<style>
/* анкета обратной связи: шкала 1–10, загрузка */
#lf-anketa .lf-scale{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:8px!important}
#lf-anketa .lf-sc{height:52px!important;margin:0!important;padding:0!important;border-radius:14px!important;border:1px solid #1E3A3C!important;background:#0C1618!important;font:inherit!important;font-size:18px!important;font-weight:700!important;cursor:pointer!important;-webkit-appearance:none!important;appearance:none!important;transition:border-color .2s,background-color .2s!important}
#lf-anketa .lf-sc:hover{border-color:#2A4B4D!important}
#lf-anketa .lf-sc:focus-visible{outline:2px solid #3ED6CE!important;outline-offset:2px!important}
#lf-anketa .lf-sc.sel{background:#3ED6CE!important;border-color:#3ED6CE!important;color:#04211F!important}
#lf-anketa .lf-scale-l{display:flex!important;justify-content:space-between!important;gap:12px!important;margin-top:8px!important;font-size:13px!important;color:#8FA5A7!important}
#lf-anketa .lf-scale-l span:last-child{text-align:right!important}
#lf-anketa .lf-q.invalid .lf-sc{border-color:rgba(255,139,123,.55)!important}
#lf-anketa .lf-load{text-align:center!important;padding:64px 0!important;color:#8FA5A7!important}
#lf-anketa .lf-spin{width:36px!important;height:36px!important;margin:0 auto 18px!important;border-radius:50%!important;border:3px solid #1E3A3C!important;border-top-color:#3ED6CE!important;animation:lfSpin 1s linear infinite!important}
@keyframes lfSpin{to{transform:rotate(360deg)}}
#lf-anketa .lf-done .lf-note{text-align:left!important}
</style>

<div id="lf-anketa" aria-live="polite"></div>

<script>
function lfInit(root){
/* =================== НАСТРОЙКИ =================== */
var CONFIG = {
  // адрес веб-приложения Lite Fit; пусто – страница берёт его из кабинета (папка cabinet рядом)
  api: "",
  cabinet: "../cabinet/",
  // запасная ссылка на обычную Google Форму, если что-то пошло не так
  fallback: "https://docs.google.com/forms/d/e/1FAIpQLSfRQnuk_8goSyduN2IZtdUWqU2tbU0bFCfS7xA638jnUCRK0A/viewform"
};
/* ================================================= */

// шаги анкеты: ключи вопросов Google Формы (сервер узнаёт их по заголовкам), «*» – вопросы без своего места
var LAYOUT = [
  {title:"Давайте знакомиться", lead:"Чтобы мы поняли, от кого ответы.", keys:["name","email","format"]},
  {title:"Как прошёл ваш период с нами", lead:"Команда Lite Fit благодарит вас за время, проведённое с нами. Расскажите честно, как всё прошло – нам это важно, чтобы становиться лучше. Это займёт 3–4 минуты.", keys:["score","expect","results"]},
  {title:"Что было хорошо, а что – нет", lead:"Пишите как есть – любые замечания помогают нам становиться лучше.", keys:["liked","hard","lack"]},
  {title:"Поддержка и идеи", lead:"Ещё пара вопросов – и почти всё.", keys:["support","change","recommend","*"]},
  {title:"Ваш отзыв", lead:"Последний шаг.", keys:["consent","review"]}
];
// подписи вопросов на странице (в самой Google Форме ничего не меняется)
var LABEL = {
  name:     {label:"Имя и фамилия", ph:"Например: Анна Смирнова", ac:"name"},
  email:    {label:"Электронная почта", hint:"Та же, что вы указывали в анкете при старте", ph:"name@mail.ru", ac:"email"},
  format:   {label:"Какой у вас формат ведения?"},
  score:    {label:"Оцените этот период от 1 до 10", hint:"10 – лучше, чем ожидали"},

var token = (/[?&]t=([a-z0-9]+)/i.exec(location.search) || [])[1] || "";
var API = "", INFO = null, STEPS = [], state = {}, step = 0;

document.body.style.margin = "0"; document.body.style.background = "#05090B";

function el(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){ if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (html != null) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#3ED6CE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------- загрузка: адрес веб-приложения и вопросы ---------- */
function apiFromCabinet(){
  return fetch(CONFIG.cabinet, {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/);
    if (!m) throw new Error("нет адреса");
    try { localStorage.setItem("lf_api", m[0]); } catch(e){}
    return m[0];
  });
}
function getInfo(api){
  return fetch(api + "?a=fb&t=" + encodeURIComponent(token)).then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || "нет ответа"); API = api; return j; });
}
function load(){
  root.innerHTML = '<div class="lf-load"><div class="lf-spin"></div>Загружаем анкету…</div>';
  var cached = CONFIG.api; if (!cached) { try { cached = localStorage.getItem("lf_api") || ""; } catch(e){} }
  var p = cached ? getInfo(cached).catch(function(){ return apiFromCabinet().then(getInfo); }) : apiFromCabinet().then(getInfo);
  p.then(start).catch(function(e){ fail("Не получилось загрузить анкету (" + esc(e.message || e) + ")."); });
}
function fail(msg){
  root.innerHTML = "";
  var w = el("div",{class:"lf-step"});
  w.appendChild(el("h2",{class:"lf-title"}, "Что-то пошло не так"));
  w.appendChild(el("p",{class:"lf-lead"}, msg + " Проверьте интернет и обновите страницу или заполните анкету в Google Форме."));
  w.appendChild(el("a",{class:"lf-btn lf-primary",href:CONFIG.fallback,target:"_blank",rel:"noopener",style:"width:100%"}, "Открыть Google Форму"));
  root.appendChild(w);
}

/* ---------- шаги из вопросов формы ---------- */
function start(info){
  INFO = info;
  var items = info.form.items, auto = (info.client && info.client.auto) || [], byKey = {}, placed = {};
  items.forEach(function(it){ if (it.key) byKey[it.key] = it; });
  function field(it){
    var L = LABEL[it.key] || {}, help = it.help && !L.hint ? it.help : L.hint;
    if (it.type === "scale" && (it.ll || it.rl)) help = "";
    return {key: it.key || it.entry, entry: it.entry, type: it.type, label: L.label || it.title, hint: help || "", ph: L.ph || "", ac: L.ac || "",
      req: it.req, options: (it.choices || []).map(function(c){ return {value:c}; }), other: it.other, lo: it.lo, hi: it.hi, ll: it.ll, rl: it.rl};
  }
  STEPS = [];
  LAYOUT.forEach(function(s){
    var f = [];
    s.keys.forEach(function(k){
      if (k === "*"){ items.forEach(function(it){ if (!it.key) { f.push(field(it)); placed[it.entry] = 1; } }); return; }
      if (k === "email"){
        if (info.form.email && !(info.client && info.client.hasEmail)) f.push({key:"email", type:"email", label:LABEL.email.label, hint:LABEL.email.hint, ph:LABEL.email.ph, ac:"email", req:true});
        return;
      }
      var it = byKey[k]; if (!it) return;
      placed[it.entry] = 1;
      if (auto.indexOf(k) !== -1) return;
      f.push(field(it));
    });
    if (f.length) STEPS.push({title:s.title, lead:s.lead, fields:f});
  });
  // вопросы, которых нет в раскладке, – в последний шаг
  var rest = items.filter(function(it){ return !placed[it.entry]; }).map(field);
  if (rest.length) { if (STEPS.length) STEPS[STEPS.length-1].fields = STEPS[STEPS.length-1].fields.concat(rest); else STEPS.push({title:"Анкета", fields:rest}); }
  if (!STEPS.length) { fail("В анкете нет вопросов."); return; }
  render();
}

function showField(f){
  if (f.key === "review" && INFO) {
    var c = INFO.form.items.filter(function(x){ return x.key === "consent"; })[0];
    if (c) return /^\W*да/i.test(String(state.consent || ""));
  }
  return true;
}

function render(){
  root.innerHTML = "";
  var s = STEPS[step];
  var wrap = el("div",{class:"lf-step"});
  var prog = el("div",{class:"lf-progress","aria-hidden":"true"});
  STEPS.forEach(function(_,i){
    if (i>0) prog.appendChild(el("span",{class:"lf-link"+(i<=step?" done":"")}));
    var d = el("span",{class:"lf-dot"+(i<step?" done":(i===step?" now":""))});
    d.style.backgroundImage = "url("+LOGO+")";
    prog.appendChild(d);
  });
  wrap.appendChild(prog);
  wrap.appendChild(el("p",{class:"lf-stepnum"},"Шаг "+(step+1)+" из "+STEPS.length));
  var first = INFO.client && INFO.client.first;
  var title = (step === 0 && first && s.title === LAYOUT[1].title) ? first + ", как прошёл ваш период с нами?" : s.title;
  wrap.appendChild(el("h2",{class:"lf-title"}, esc(title)));
  if (s.lead) wrap.appendChild(el("p",{class:"lf-lead"}, esc(s.lead)));
  if (step === 0 && INFO.bad) wrap.appendChild(el("p",{class:"lf-note"},"Ссылка устарела – ничего страшного, просто укажите имя и почту."));
  if (step === 0 && INFO.done) wrap.appendChild(el("p",{class:"lf-note"},"Вы уже отвечали <b>"+esc(INFO.done)+"</b> – спасибо! Если хотите что-то дополнить, можно заполнить анкету ещё раз."));
  if (step === 0 && INFO.open === false) wrap.appendChild(el("p",{class:"lf-note"},"Анкета сейчас не принимает ответы – напишите, пожалуйста, вашему тренеру."));

  s.fields.forEach(function(f){ if (showField(f)) wrap.appendChild(renderField(f)); });

  var nav = el("div",{class:"lf-nav"});
  if (step > 0){
    var back = el("button",{type:"button",class:"lf-btn lf-secondary lf-back","aria-label":"Назад"}, ICON.back);
    back.onclick = function(){ step--; render(); scrollTop(); };
    nav.appendChild(back);
  }
  var last = step === STEPS.length-1;
  var next = el("button",{type:"button",class:"lf-btn lf-primary"}, last ? "Отправить ответы" : "Далее");
  next.onclick = function(){ if (validate()) { if (last) submit(next); else { step++; render(); scrollTop(); } } };
  nav.appendChild(next);
  wrap.appendChild(nav);
  if (last) wrap.appendChild(el("p",{class:"lf-senderr"},""));
  root.appendChild(wrap);
}

function qWrap(f){
  var q = el("div",{class:"lf-q","data-key":f.key});
  q.appendChild(el("span",{class:"lf-label",id:"lf-l-"+f.key}, esc(f.label) + (!f.req ? '<span class="lf-opt-mark">необязательно</span>' : "")));
  if (f.hint) q.appendChild(el("p",{class:"lf-hint"}, esc(f.hint)));
  return q;
}

function renderField(f){
  var q = qWrap(f);
  var err = el("p",{class:"lf-err"});

  if (f.type==="text" || f.type==="email" || f.type==="textarea"){
    var inp = f.type==="textarea" ? el("textarea",{class:"lf-input lf-control",rows:"3"}) : el("input",{class:"lf-input lf-control",type:f.type});
    inp.setAttribute("aria-labelledby","lf-l-"+f.key);
    if (f.ph) inp.setAttribute("placeholder", f.ph);
    if (f.ac) inp.setAttribute("autocomplete", f.ac);
    inp.value = state[f.key] || "";
    inp.oninput = function(){ state[f.key] = inp.value; q.classList.remove("invalid"); };
    if (f.type!=="textarea") inp.onkeydown = function(e){ if (e.key==="Enter"){ e.preventDefault(); root.querySelector(".lf-primary").click(); } };
    q.appendChild(inp);
  }

  if (f.type==="scale"){
    var box = el("div",{class:"lf-scale lf-control",role:"radiogroup","aria-labelledby":"lf-l-"+f.key});
    var n = f.hi - f.lo + 1;
    if (n !== 10) box.style.setProperty("grid-template-columns","repeat("+Math.min(n,6)+",1fr)","important");
    for (var v = f.lo; v <= f.hi; v++) (function(v){
      var b = el("button",{type:"button",class:"lf-sc",role:"radio"}, String(v));
      function paint(){ var on = String(state[f.key]) === String(v); b.classList.toggle("sel", on); b.setAttribute("aria-checked", on ? "true" : "false"); }
      paint(); b._paint = paint;
      b.onclick = function(){ state[f.key] = v; [].forEach.call(box.querySelectorAll(".lf-sc"), function(x){ x._paint(); }); q.classList.remove("invalid"); };
      box.appendChild(b);
    })(v);
    q.appendChild(box);
    if (f.ll || f.rl) q.appendChild(el("div",{class:"lf-scale-l"}, "<span>"+(f.ll ? esc(f.lo+" – "+f.ll) : "")+"</span><span>"+(f.rl ? esc(f.hi+" – "+f.rl) : "")+"</span>"));
  }

  if (f.type==="radio" || f.type==="checkbox"){
    var multi = f.type==="checkbox";
    var list = el("div",{class:"lf-choices lf-control",role: multi ? "group" : "radiogroup","aria-labelledby":"lf-l-"+f.key});
    var opts = f.options.slice();
    if (f.other) opts.push({value:"__other__", label:"Другое"});
    var otherInp;
    opts.forEach(function(o){
      var b = el("button",{type:"button",class:"lf-choice",role: multi ? "checkbox" : "radio"},
        '<span class="lf-ind"></span><span class="lf-ctext">'+esc(o.label || o.value)+'</span>');
      function isSel(){ return multi ? (state[f.key]||[]).indexOf(o.value)!==-1 : state[f.key]===o.value; }
      function paint(){ var on = isSel(); b.classList.toggle("sel", on); b.setAttribute("aria-checked", on ? "true" : "false"); }
      paint();
      b.onclick = function(){
        if (multi){
          var arr = (state[f.key]||[]).slice(); var i = arr.indexOf(o.value);
          if (i===-1) arr.push(o.value); else arr.splice(i,1);
          state[f.key] = arr;
        } else state[f.key] = o.value;
        [].forEach.call(list.querySelectorAll(".lf-choice"), function(x){ x._paint && x._paint(); });
        if (otherInp){ var show = multi ? state[f.key].indexOf("__other__")!==-1 : state[f.key]==="__other__"; otherInp.classList.toggle("show", show); if (show && o.value==="__other__") otherInp.focus(); }
        q.classList.remove("invalid");
        if (f.key === "consent") render();   // показать / скрыть поле отзыва
      };
      b._paint = paint;
      list.appendChild(b);
    });
    q.appendChild(list);
    if (f.other){
      otherInp = el("input",{class:"lf-input lf-other",type:"text",placeholder:"Напишите свой вариант","aria-label":"Свой вариант"});
      otherInp.value = state[f.key+"_other"] || "";
      if (multi ? (state[f.key]||[]).indexOf("__other__")!==-1 : state[f.key]==="__other__") otherInp.classList.add("show");
      otherInp.oninput = function(){ state[f.key+"_other"] = otherInp.value; q.classList.remove("invalid"); };
      q.appendChild(otherInp);
    }
  }

  q.appendChild(err);
  return q;
}

function validate(){
  var ok = true, first = null;
  STEPS[step].fields.forEach(function(f){
    if (!showField(f)) return;
    var q = root.querySelector('.lf-q[data-key="'+f.key+'"]'); var msg = "";
    var v = state[f.key];
    if (f.req){
      if (f.type==="checkbox" && !(v && v.length)) msg = "Выберите хотя бы один вариант";
      else if ((f.type==="radio" || f.type==="scale") && (v==null || v==="")) msg = f.type==="scale" ? "Выберите оценку" : "Выберите вариант";
      else if (/text|email|textarea/.test(f.type) && !(v && String(v).trim())) msg = "Заполните это поле";
    }
    if (!msg && f.type==="email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim())) msg = "Проверьте адрес почты – похоже, в нём опечатка";
    if (!msg && f.other){
      var picked = f.type==="checkbox" ? (v||[]).indexOf("__other__")!==-1 : v==="__other__";
      if (picked && !(state[f.key+"_other"]||"").trim()) msg = "Напишите свой вариант или снимите «Другое»";
    }
    if (q){ q.classList.toggle("invalid", !!msg); q.querySelector(".lf-err").textContent = msg; }
    if (msg){ ok = false; if (!first) first = q; }
  });
  if (first) first.scrollIntoView({behavior:"smooth", block:"center"});
  return ok;
}

function payload(){
  var out = [];
  STEPS.forEach(function(s){ s.fields.forEach(function(f){
    if (!f.entry || !showField(f)) return;
    var v = state[f.key]; if (v==null || v==="") return;
    if (f.type==="checkbox"){
      v.forEach(function(x){ out.push([f.entry, x==="__other__" ? "__other_option__" : x]); });
      if (v.indexOf("__other__")!==-1) out.push([f.entry+".other_option_response", (state[f.key+"_other"]||"").trim()]);
      return;
    }
    if (f.type==="radio" && v==="__other__"){ out.push([f.entry,"__other_option__"]); out.push([f.entry+".other_option_response", (state[f.key+"_other"]||"").trim()]); return; }
    out.push([f.entry, String(v).trim()]);
  }); });
  return out;
}

function submit(btn){
  btn.disabled = true; btn.textContent = "Отправляем…";
  var errBox = root.querySelector(".lf-senderr"); errBox.classList.remove("show");
  fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({a:"fb", t:token, email:(state.email||"").trim(), fields:payload()})})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j.ok) done(j); else throw new Error(j.error || "нет ответа"); })
    .catch(function(e){
      btn.disabled = false; btn.textContent = "Отправить ответы";
      errBox.innerHTML = "Не получилось отправить: " + esc(e.message || e) + '. Попробуйте ещё раз или <a href="'+CONFIG.fallback+'" target="_blank" rel="noopener">заполните анкету здесь</a>.';
      errBox.classList.add("show");
    });
}

function done(j){
  root.innerHTML = "";
  var name = j.first || (INFO.client && INFO.client.first) || (state.name||"").trim().split(/\s+/)[0];
  var w = el("div",{class:"lf-step lf-done"});
  w.appendChild(el("div",{class:"lf-done-ico"}, ICON.check));
  w.appendChild(el("h2",{class:"lf-title"}, "Спасибо" + (name ? ", " + esc(name) : "") + "!"));
  w.appendChild(el("p",{class:"lf-lead"}, "Ваши ответы получены. Их прочитает вся команда Lite Fit, а ваш тренер учтёт их в дальнейшей работе."));
  root.appendChild(w); scrollTop();
}

function scrollTop(){
  var r = root.getBoundingClientRect();
  if (r.top < 0) root.scrollIntoView({behavior:"smooth", block:"start"});
}

load();
}

(function(){
  function start(){
    var r = document.getElementById("lf-anketa");
    if (r && !r.getAttribute("data-lf-ready")) { r.setAttribute("data-lf-ready","1"); lfInit(r); }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
